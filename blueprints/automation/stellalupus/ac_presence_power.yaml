blueprint:
  name: "Кондиционер: вкл/выкл по присутствию"
  description: >
    Включает кондиционер, когда кто-то приближается к дому (входит в
    широкую зону approach_zone, например радиусом 5 км) или уже оказался
    дома (zone.home переходит из 0 в 1+), и выключает его, когда дом
    полностью опустел (zone.home падает до 0 — с задержкой
    home_departure_delay, чтобы кратковременная потеря GPS-сигнала не
    вызывала ложное выключение).

    zone.home — встроенная зона Home Assistant; её числовое состояние
    равно количеству отслеживаемых person-сущностей внутри неё, поэтому
    blueprint не требует перечислять конкретных людей — работает для
    любого числа домочадцев с настроенными device_tracker'ами.

    Реагирует только на сам момент переключения присутствия (условие
    "кондиционер сейчас в other состоянии") — если кондиционер выключен
    вручную, пока кто-то дома, автоматика не станет включать его снова
    сама, пока не будет нового «приезда»/«подъезда».

    После включения конкретный режим (cool/dry/fan_only) и уставка
    подхватываются отдельным blueprint'ом климат-контроля
    (ac_climate_control.yaml, тот же репозиторий) — эта автоматика
    отвечает только за вкл/выкл, не за выбор режима.
  domain: automation
  author: StellaLupus
  source_url: https://github.com/StellaLupus/ha/blob/main/blueprints/automation/stellalupus/ac_presence_power.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    devices:
      name: Устройства
      icon: mdi:air-conditioner
      input:
        ac_climate:
          name: Кондиционер
          selector:
            entity:
              domain: climate

    zones:
      name: Зоны присутствия
      icon: mdi:map-marker-radius
      input:
        approach_zone:
          name: Зона "подъезжаю к дому"
          description: >
            Более широкая зона вокруг дома (например, 5 км) — используется
            через её числовое состояние (количество людей внутри) для
            предварительного включения кондиционера ещё по пути домой.
          selector:
            entity:
              domain: zone

    settings:
      name: Настройки поведения
      icon: mdi:cog
      collapsed: true
      input:
        arrival_hvac_mode:
          name: Режим при включении
          description: >
            Временный режим при включении — конкретный режим и уставку
            тут же скорректирует автоматика климат-контроля.
          default: cool
          selector:
            select:
              options: ["cool", "dry", "fan_only", "auto"]
        home_departure_delay:
          name: Задержка перед выключением при отъезде
          description: Минуты. Защита от кратковременных потерь GPS-сигнала (zone.home на секунду падает до 0).
          default: 5
          selector:
            number: { min: 0, max: 60, unit_of_measurement: "мин", mode: box }

trigger_variables:
  home_departure_delay: !input home_departure_delay

triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for:
      minutes: "{{ home_departure_delay }}"
    id: everybody_left
  - trigger: numeric_state
    entity_id: zone.home
    above: 0
    id: somebody_arrived
  - trigger: numeric_state
    entity_id: !input approach_zone
    above: 0
    id: approaching

mode: restart

actions:
  - alias: "Дом опустел — выключаем кондиционер"
    choose:
      - conditions:
          - condition: trigger
            id: everybody_left
          - condition: not
            conditions:
              - condition: state
                entity_id: !input ac_climate
                state: "off"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "off"

  - alias: "Кто-то подъезжает или уже дома — включаем кондиционер"
    choose:
      - conditions:
          - condition: trigger
            id: ["somebody_arrived", "approaching"]
          - condition: state
            entity_id: !input ac_climate
            state: "off"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: !input arrival_hvac_mode
