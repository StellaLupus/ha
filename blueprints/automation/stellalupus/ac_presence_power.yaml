blueprint:
  name: "Кондиционер: выкл по присутствию"
  description: >
    Выключает кондиционер, когда дом полностью опустел (zone.home падает
    до 0 — с задержкой home_departure_delay, чтобы кратковременная потеря
    GPS-сигнала не вызывала ложное выключение).

    zone.home — встроенная зона Home Assistant; её числовое состояние
    равно количеству отслеживаемых person-сущностей внутри неё, поэтому
    blueprint не требует перечислять конкретных людей — работает для
    любого числа домочадцев с настроенными device_tracker'ами.

    v2: автоматическое включение по приезду/приближению к дому убрано —
    трекеры присутствия оказались недостаточно надёжны (ложные geofence-
    переходы без GPS-фикса, залипание координат на несколько часов),
    из-за чего кондиционер иногда выключался, пока человек был дома, а
    затем включался бы обратно по ложному "приезду" — непредсказуемо.
    Включение теперь только вручную или через отдельную автоматику
    климат-контроля (ac_climate_control.yaml), если/когда решите её
    настроить на самостоятельное включение.

    После выключения дальнейшее управление режимом/уставкой не
    выполняется — этим занимается отдельный blueprint климат-контроля
    (ac_climate_control.yaml, тот же репозиторий), пока кондиционер
    включён.
  domain: automation
  author: StellaLupus
  source_url: https://github.com/StellaLupus/ha/blob/main/blueprints/automation/stellalupus/ac_presence_power.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    devices:
      name: Устройства
      icon: mdi:air-conditioner
      input:
        ac_climate:
          name: Кондиционер
          selector:
            entity:
              domain: climate

    settings:
      name: Настройки поведения
      icon: mdi:cog
      collapsed: true
      input:
        home_departure_delay:
          name: Задержка перед выключением при отъезде
          description: Минуты. Защита от кратковременных потерь GPS-сигнала (zone.home на секунду падает до 0).
          default: 5
          selector:
            number: { min: 0, max: 60, unit_of_measurement: "мин", mode: box }

trigger_variables:
  home_departure_delay: !input home_departure_delay

triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for:
      minutes: "{{ home_departure_delay }}"
    id: everybody_left

mode: restart

actions:
  - alias: "Дом опустел — выключаем кондиционер"
    choose:
      - conditions:
          - condition: trigger
            id: everybody_left
          - condition: not
            conditions:
              - condition: state
                entity_id: !input ac_climate
                state: "off"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "off"
