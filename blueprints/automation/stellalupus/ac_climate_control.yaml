blueprint:
  name: "Кондиционер: климат-контроль (duty-cycle + антиовершут + обогрев)"
  description: >
    v3.2: лечение трёх дефектов, из-за которых блок простаивал при перегретой
    комнате, а контур пинг-понговал между направлениями.

    (1) Часы фазы duty-цикла считаются ТОЛЬКО по собственной метке. Раньше
    отсчёт брался как min(метка, last_changed climate-сущности), а её двигает
    кто угодно: внутренний термостат блока, отскок облака, пульт, флап
    unavailable. Каждое такое событие взводило барьер минимального интервала
    заново, и при duty = 1.0 блок стоял выключенным (наблюдалось: комната 24.7
    при цели 24, все условия входа в cool истинны кроме барьера). Отдельная
    величина seconds_since_compressor_change сохраняет старую семантику и
    используется там, где смысл именно в защите железа от частых пусков.

    (2) Осушение получило температурный предохранитель. dry на этом железе —
    работа компрессора на холод, но без цели и без выхода по температуре:
    как off-фаза duty-цикла оно уводило комнату на 1.5-3 °C ниже цели,
    пробивало порог входа в обогрев и разворачивало весь контур. Выход из dry
    по температуре не ждёт минимального интервала — иначе барьер дорисовывает
    ещё градус увода вниз.

    (3) Поправка уставки ограничена по модулю. Встроенный датчик кондиционера
    меряет обратный воздух/теплообменник: в работе он уезжает на 5-10 °C вниз
    (наблюдалось 14 °C при комнатных 22.9), и формула уставка = цель + offset
    загоняла уставку в минимум — блок работал в пол и проносил комнату мимо
    цели. Плюс режим перечитывается нативным condition непосредственно перед
    отправкой уставки: current_mode снят на старте прогона, а первый блок
    действий мог за эти миллисекунды погасить блок, и команда терялась,
    впустую сжигая интервал троттлинга.

    v3.1: у комнаты одна целевая температура на оба направления, а порог
    входа в обогрев — отдельная величина, только условие входа. Раньше
    обогрев вёл комнату к своей цели, совпадавшей с порогом: нагрев
    останавливался ровно там, где арбитр ещё считает, что холодно, и
    контур залипал в обогреве, которого никто не выполнял.

    Порог при этом никуда не делся из логики блока: направление контура
    разрешает обогрев, но не обязывает. Комната входит в heat только если
    прогноз ниже её порога, а уже внутри эпизода нагрева планка
    поднимается до целевой — иначе нагрев замирал бы на пороге, как в v3.
    Без этого условия комната, которой ничего не надо, начинала бы греться
    просто потому, что соседняя утащила контур в обогрев, и могла бы
    разогреться до собственной потребности в холоде.

    v3: добавлен обогрев и соблюдение единого направления мультисплита.

    Внутренние блоки мультисплита висят на одном наружном блоке: контур
    хладагента один, поэтому физически невозможно греть одним блоком и
    одновременно холодить/осушать другим. Направление выбирает отдельная
    автоматика-арбитр (по приоритету комнат) и публикует его в input_select;
    этот blueprint — покомнатный исполнитель, который крутит duty-cycle
    только в разрешённую сторону.

    Математика duty-cycle не изменилась — изменился только знак ошибки и
    то, какой режим считается рабочим:

      прогноз = внешний_датчик + скорость_изменения × горизонт_упреждения
      охлаждение: error = прогноз - целевая,  рабочий режим cool
      обогрев:    error = целевая - прогноз,  рабочий режим heat
      duty = clamp(error / ширина_зоны, 0, 1)

    Целевая одна и та же в обе стороны — разница только в знаке ошибки.
    Порог входа в обогрев в этой математике не участвует: он живёт в
    арбитре и решает, когда разворачивать контур, а не докуда греть.

    Скорость изменения берётся из отдельного helper'а derivative (native HA
    helper, не Jinja-математика) на основе внешнего датчика температуры.
    Прогнозирование на несколько минут вперёд гасит физическую тепловую
    инерцию кондиционера (после команды "хватит" комната по инерции ещё
    идёт на 0.3-0.6°C дальше) — переключение происходит чуть раньше, до
    того как инерция пронесёт температуру мимо цели.

    Off-фаза duty-цикла: dry, если в охлаждении влажность выше порога,
    иначе off. Сама автоматика fan_only никогда не выбирает — вентиляция
    без компрессора ничего не даёт, шумит, а при обогреве ещё и гоняет
    воздух комнатной температуры, который из-за обдува ощущается холодным.

    Но включённый вручную fan_only автоматика и не гасит: компрессор он не
    занимает, направлению контура не противоречит, поэтому в списке
    запрещённых режимов его нет. Из fan_only блок уводится только когда
    реально нужен другой режим — cool, heat или dry.

    Осушение включается и из состояния off, а не только из активной
    off-фазы: иначе блок, оказавшийся выключенным при отсутствии
    потребности в холоде, уже никогда бы не начал осушать, даже когда
    влажность ушла за порог.

    Горизонт упреждения вынесен в отдельный helper, общий с арбитром: если
    бы у них разошёлся горизонт, арбитр разворачивал бы контур не тогда,
    когда комнаты этого ждут.

    ВАЖНО: since v3 состояние off — рабочая фаза паузы, а не сигнал "не
    трогай". Автоматика включит кондиционер обратно, когда появится
    потребность. Чтобы выключить комнату насовсем, гасите её тумблер
    автоматики; чтобы погасить всю систему — отдельный тумблер полного
    выключения у арбитра. Именно потому, что off стал рабочим состоянием,
    полное выключение вынесено в явный переключатель, а не выражается
    установкой кондиционера в off.

    Смена уставки (climate.set_temperature) — отдельный, троттлящийся
    (не чаще раза в N минут) offset-трюк, компенсирующий встроенный датчик
    кондиционера; пропускается, если встроенный датчик давно не обновлялся
    (застрял) — иначе коррекция бьёт по устаревшим данным. Формула
    (уставка = цель + offset) одинаково верна и для охлаждения, и для
    обогрева: в обоих случаях блок останавливается по своему внутреннему
    датчику.

    Защита от конфликта направлений — три слоя: (1) ветка аварийного
    выхода гасит блок, оказавшийся в запрещённом для текущего направления
    режиме (включая auto, где блок может сам выбрать нагрев), без задержек
    и без таймера мин. интервала; (2) вход в рабочий режим разрешён только
    когда ни один из соседних блоков не работает в противоположную сторону;
    (3) арбитр не разворачивает контур чаще заданного интервала. Вместе это
    даёт безопасный двухфазный разворот без явной оркестрации.

    Барьер минимального интервала асимметричен: ВХОД в рабочий режим он
    держит всегда (защита компрессора от частых пусков), а выход — только
    пока цель не достигнута. Симметричный барьер додерживал блок в
    рабочем режиме и после достижения цели: комната уезжала за цель ровно
    на длину барьера, а в обогреве это ещё и роняло её под порог входа,
    разворачивая весь контур. Совсем без барьера на выходе тоже нельзя:
    on_duration пересчитывается каждый прогон, поэтому скачок производной
    обнулял бы расчётную длительность фазы и давал пуски компрессора по
    20-60 секунд. Отсюда развилка: duty упал в ноль (цель взята) — гасим
    сразу, duty просто просел — держим минимальное время работы.

    Вынужденная пауза после разворота контура не считается фазой
    duty-цикла: её начал не duty-цикл, а смена направления, поэтому
    ожидание (окно − on_duration) к ней не применяется. Определяется она
    по близости отметок времени смены режима и смены направления, а не по
    отказу писать метку: отсчёт всё равно обнуляется через last_changed
    самой climate-сущности, которую set_hvac_mode сбрасывает, так что не
    писать метку — значит просто оставить хелпер протухшим.

    Решения о ВХОДЕ в hvac_mode дополнительно защищены собственным
    таймером минимального интервала (input_datetime helper, а не
    last_changed climate-сущности) плюс нативным
    `condition: state ... for: {seconds: 3}` — второй барьер проверяется
    центральным движком HA по факту непрерывности состояния, а не нашим
    шаблоном, и не подвержен гонке между двумя почти одновременно
    стартовавшими прогонами автоматики (наблюдался баг двойного
    переключения режима за единицы-десятки миллисекунд, который ни `mode:
    single`, ни собственный таймер полностью не устраняли). Именно ради
    сохранения этой нативной защиты вход и выход для cool и heat сделаны
    отдельными ветками с литеральными state, а не одной веткой с шаблоном.

    Тумблер (input_boolean) включает/выключает всю автоматику для
    конкретного кондиционера.
  domain: automation
  author: StellaLupus
  source_url: https://github.com/StellaLupus/ha/blob/main/blueprints/automation/stellalupus/ac_climate_control.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    devices:
      name: Устройства
      icon: mdi:air-conditioner
      input:
        ac_climate:
          name: Кондиционер
          description: Climate-сущность кондиционера, которым управляем.
          selector:
            entity:
              domain: climate
        other_ac_units:
          name: Остальные внутренние блоки мультисплита
          description: >
            Все прочие внутренние блоки на том же наружном блоке. Вход в
            рабочий режим блокируется, пока хоть один из них работает в
            противоположном направлении — это и обеспечивает безопасный
            разворот контура. Перечислите здесь все блоки, кроме этого.
          selector:
            entity:
              domain: climate
              multiple: true
        temp_sensor:
          name: Датчик температуры
          description: Внешний датчик температуры в помещении (не встроенный в кондиционер).
          selector:
            entity:
              domain: sensor
              device_class: temperature
        humidity_sensor:
          name: Датчик влажности
          description: >
            Внешний датчик влажности в помещении. Если он временно
            недоступен, режим dry просто не выбирается — остальная логика
            продолжает работать.
          selector:
            entity:
              domain: sensor
              device_class: humidity
        temp_rate_sensor:
          name: Датчик скорости изменения температуры
          description: >
            Derivative-helper (HA helper "Производная") на основе датчика
            температуры этого помещения, unit_time=min. Используется для
            прогноза температуры на несколько минут вперёд и гашения
            овершута от тепловой инерции кондиционера.
          selector:
            entity:
              domain: sensor

    helpers:
      name: Параметры (input_number / input_datetime / input_boolean / input_select)
      icon: mdi:tune
      description: >
        Существующие helper-сущности. Часть из них покомнатные (свои для
        каждого кондиционера), часть — общие для всей системы: направление
        и горизонт упреждения должны быть одни на весь мультисплит.
      input:
        enable_toggle:
          name: Тумблер автоматики
          description: input_boolean, включающий/выключающий весь автоматический климат-контроль.
          selector:
            entity:
              domain: input_boolean
        system_direction_helper:
          name: Направление системы (общий, служебное)
          description: >
            input_select со значениями "Охлаждение" / "Обогрев" / "Простой",
            который пишет автоматика-арбитр. ОДИН И ТОТ ЖЕ для всех блоков
            мультисплита — иначе блоки разъедутся по направлениям.
          selector:
            entity:
              domain: input_select
        target_temp_helper:
          name: Целевая температура (комфорт)
          description: >
            Единая цель комнаты для ОБОИХ направлений: и охлаждение, и
            обогрев ведут комнату к этой температуре. Раньше у обогрева
            была своя цель — из-за этого нагрев останавливался на пороге
            входа в обогрев, то есть ровно там, где арбитр ещё считает,
            что комнате холодно.
          selector:
            entity:
              domain: input_number
        heat_target_temp_helper:
          name: Порог входа в обогрев
          description: >
            ТОЛЬКО условие разворота контура, не цель нагрева. Когда
            прогноз опускается ниже этого значения, арбитр переводит весь
            мультисплит в обогрев, а греет блок уже до целевой
            температуры (комфорт). Должен быть заметно НИЖЕ цели —
            промежуток между ними это мёртвая зона, в которой комната
            ничего не требует. Комнате, которую греть почти никогда не
            надо, ставьте низкое значение.

            Ключ входа исторически называется heat_target_temp_helper (в
            v3 это была отдельная цель обогрева). Имя ключа сохранено
            намеренно: переименование сломало бы уже созданные из этого
            blueprint автоматизации с MissingInput.
          selector:
            entity:
              domain: input_number
        temp_hysteresis_helper:
          name: Ширина пропорциональной зоны (duty-cycle)
          description: >
            Отклонение прогнозируемой температуры от цели (°C), при
            котором duty достигает 1 (кондиционер работает в рабочем
            режиме непрерывно). Меньше значение — агрессивнее реакция на
            небольшие отклонения, но больше переключений режима.
          selector:
            entity:
              domain: input_number
        setpoint_hysteresis_helper:
          name: Гистерезис коррекции уставки
          description: >
            Порог для коррекции уставки (climate.set_temperature) —
            команда шлётся только если расчётная уставка отличается от
            текущей не меньше чем на это значение.
          selector:
            entity:
              domain: input_number
        humidity_threshold_helper:
          name: Порог влажности для осушения
          selector:
            entity:
              domain: input_number
        humidity_hysteresis_helper:
          name: Гистерезис влажности
          selector:
            entity:
              domain: input_number
        min_interval_helper:
          name: Мин. интервал смены режима (минуты)
          description: Защита компрессора — минимальное время между переключениями hvac_mode.
          selector:
            entity:
              domain: input_number
        lag_helper:
          name: Горизонт упреждения (общий, минуты)
          description: >
            На сколько минут вперёд прогнозировать температуру по текущей
            скорости изменения. ОБЩИЙ с арбитром направления — они должны
            считать прогноз одинаково, иначе арбитр будет разворачивать
            контур не тогда, когда комнаты этого ждут. 0 — упреждение
            выключено (чистый duty-cycle без антиовершута).
          selector:
            entity:
              domain: input_number
        last_mode_change_helper:
          name: Метка времени последней смены режима (служебное)
          description: >
            input_datetime, в который автоматика сама пишет текущее время
            сразу при каждой смене hvac_mode. Используется вместо
            last_changed climate-сущности для защиты от гонки при быстрых
            последовательных срабатываниях.
          selector:
            entity:
              domain: input_datetime
        last_setpoint_correction_helper:
          name: Метка времени последней коррекции уставки (служебное)
          description: input_datetime для троттлинга offset-коррекции уставки.
          selector:
            entity:
              domain: input_datetime

    settings:
      name: Настройки поведения
      icon: mdi:cog
      collapsed: true
      input:
        direction_cool_label:
          name: Название значения "охлаждение" в селекторе направления
          default: "Охлаждение"
          selector:
            text:
        direction_heat_label:
          name: Название значения "обогрев" в селекторе направления
          default: "Обогрев"
          selector:
            text:
        min_valid_temp:
          name: Минимально допустимая температура датчика
          description: >
            Ниже этого значения показания датчика считаются недостоверными
            (защита от промерзшего/отвалившегося датчика) — автоматика не
            действует.
          default: 5
          selector:
            number: { min: -20, max: 15, unit_of_measurement: "°C", mode: box }
        mode_switch_delay:
          name: Пауза между сменой режима и коррекцией уставки
          description: Секунды. Не даёт двум командам улететь в облако кондиционера одновременно.
          default: 2
          selector:
            number: { min: 0, max: 10, unit_of_measurement: "сек", mode: box }
        window_minutes:
          name: Окно duty-цикла
          description: >
            Минуты. При промежуточном duty (0<duty<1) кондиционер проводит
            в рабочем режиме долю window_minutes×duty, остальное время — в
            off-фазе. Должно быть заметно больше мин. интервала смены режима.
          default: 15
          selector:
            number: { min: 5, max: 60, unit_of_measurement: "мин", mode: box }
        setpoint_correction_interval_minutes:
          name: Мин. интервал коррекции уставки
          description: Минуты. Не чаще какого интервала слать climate.set_temperature.
          default: 20
          selector:
            number: { min: 5, max: 60, unit_of_measurement: "мин", mode: box }
        sensor_staleness_minutes:
          name: Порог "застрявшего" датчика кондиционера
          description: >
            Минуты. Если встроенный датчик кондиционера (current_temperature)
            не обновлялся дольше этого времени, коррекция уставки в этом
            такте пропускается — offset считался бы по устаревшим данным.
          default: 10
          selector:
            number: { min: 3, max: 60, unit_of_measurement: "мин", mode: box }
        max_setpoint_offset:
          name: Максимальная поправка уставки
          description: >
            Градусы. Ограничивает offset-трюк по модулю. Встроенный датчик
            кондиционера меряет обратный воздух/теплообменник, а не комнату:
            в работе он уезжает на 5-10 °C вниз, и некомпенсированная формула
            (уставка = цель + offset) загоняет уставку в минимум, после чего
            блок работает в пол и проносит комнату далеко мимо цели. Реальная
            погрешность датчика — единицы градусов; всё, что больше, это не
            погрешность, а режим работы.
          default: 2.5
          selector:
            number: { min: 0.5, max: 10, step: 0.5, unit_of_measurement: "°C", mode: box }
        dry_undershoot_allowance:
          name: Допустимый увод вниз при осушении
          description: >
            Градусы ниже целевой температуры, до которых разрешено осушение.
            Осушение на этом железе — работа компрессора на холод, но без
            цели и без выхода по температуре: как off-фаза duty-цикла оно
            морозит комнату сколько угодно. Ниже (цель − это значение)
            осушение гасится.
          default: 0.5
          selector:
            number: { min: 0, max: 3, step: 0.1, unit_of_measurement: "°C", mode: box }

variables:
  ac_climate: !input ac_climate
  other_ac_units: !input other_ac_units
  temp_sensor: !input temp_sensor
  humidity_sensor: !input humidity_sensor
  rate_sensor: !input temp_rate_sensor
  enable_toggle: !input enable_toggle
  system_direction_helper: !input system_direction_helper
  target_temp_helper: !input target_temp_helper
  heat_target_temp_helper: !input heat_target_temp_helper
  band_helper: !input temp_hysteresis_helper
  setpoint_hysteresis_helper: !input setpoint_hysteresis_helper
  humidity_threshold_helper: !input humidity_threshold_helper
  humidity_hysteresis_helper: !input humidity_hysteresis_helper
  min_interval_helper: !input min_interval_helper
  lag_helper: !input lag_helper
  last_mode_change_helper: !input last_mode_change_helper
  last_setpoint_correction_helper: !input last_setpoint_correction_helper
  direction_cool_label: !input direction_cool_label
  direction_heat_label: !input direction_heat_label
  min_valid_temp: !input min_valid_temp
  mode_switch_delay: !input mode_switch_delay
  window_minutes: !input window_minutes
  setpoint_correction_interval_minutes: !input setpoint_correction_interval_minutes
  sensor_staleness_minutes: !input sensor_staleness_minutes
  max_setpoint_offset: !input max_setpoint_offset
  dry_undershoot_allowance: !input dry_undershoot_allowance
  current_mode: "{{ states(ac_climate) }}"
  direction: "{{ states(system_direction_helper) }}"
  is_cool: "{{ direction == direction_cool_label }}"
  is_heat: "{{ direction == direction_heat_label }}"
  is_idle: "{{ not is_cool and not is_heat }}"
  t: "{{ states(temp_sensor) | float(0) }}"
  h: "{{ states(humidity_sensor) | float(0) }}"
  rate: "{{ states(rate_sensor) | float(0) }}"
  lag_minutes: "{{ states(lag_helper) | float(4) }}"
  target: "{{ states(target_temp_helper) | float(24) }}"
  heat_trigger: "{{ states(heat_target_temp_helper) | float(21) }}"
  band: "{{ [states(band_helper) | float(1), 0.1] | max }}"
  setpoint_th: "{{ states(setpoint_hysteresis_helper) | float(0.3) }}"
  hmax: "{{ states(humidity_threshold_helper) | float(60) }}"
  hh: "{{ states(humidity_hysteresis_helper) | float(5) }}"
  humidity_valid: >-
    {{ states(humidity_sensor) not in ['unavailable', 'unknown', 'none', 'None']
       and 0 < (states(humidity_sensor) | float(-1)) < 100 }}
  predicted_t: "{{ t + rate * lag_minutes }}"
  error: "{{ (target - predicted_t) if is_heat else (predicted_t - target) }}"
  duty: "{{ [[(error / band), 0] | max, 1] | min }}"
  active_mode: "{{ 'heat' if is_heat else 'cool' }}"
  window_seconds: "{{ (window_minutes | float(15)) * 60 }}"
  on_duration: "{{ duty * window_seconds }}"
  min_cycle_seconds: "{{ (states(min_interval_helper) | float(5)) * 60 }}"
  # Минимальная пауза компрессора перед новым пуском. Барьер фазы считается по
  # своей метке и поэтому не защищает железо: после ЧУЖОЙ остановки (внутренний
  # термостат блока, пульт, отскок облака) наша метка может быть часовой
  # давности, и вход прошёл бы через секунды после реального останова. Порог
  # намеренно короче полного интервала фазы: он защищает компрессор, а не
  # рисует duty-цикл, поэтому чужой дребезг крадёт максимум эти минуты.
  min_off_seconds: "{{ [min_cycle_seconds, 180] | min }}"
  seconds_since_mode_change_helper: >-
    {{ (now().timestamp() - (state_attr(last_mode_change_helper, 'timestamp') | default(0, true))) }}
  seconds_since_entity_change: "{{ (now() - states[ac_climate].last_changed).total_seconds() }}"
  # Часы фазы duty-цикла — ТОЛЬКО собственная метка. Climate-сущность это
  # зеркало облака, и её last_changed двигает кто угодно: сам блок по своему
  # внутреннему термостату, отскок облака, пульт, флап unavailable. Пока
  # отсчёт брался как min() с ней, каждое такое событие взводило барьер
  # входа заново, и при duty=1 блок стоял выключенным часами (комната 24.7
  # при цели 24). У арбитра тот же приём законен — там min() защищает его
  # СОБСТВЕННЫЙ выход, который никто, кроме человека, не пишет.
  seconds_since_mode_change: >-
    {{ seconds_since_mode_change_helper }}
  # Часы компрессора — там, где смысл в защите железа от частых пусков:
  # физический пуск состоялся, даже если его инициировали не мы.
  seconds_since_compressor_change: >-
    {{ [seconds_since_mode_change_helper, seconds_since_entity_change] | min }}
  seconds_since_direction_change: >-
    {{ (now() - states[system_direction_helper].last_changed).total_seconds() }}
  forced_offphase: >-
    {{ seconds_since_direction_change <= window_seconds
       and (seconds_since_mode_change - seconds_since_direction_change) | abs <= 60 }}
  at_target: "{{ duty <= 0.02 }}"
  heat_episode_active: >-
    {{ current_mode == 'heat' or seconds_since_mode_change < window_seconds }}
  heat_needed: >-
    {{ predicted_t < (target if heat_episode_active else heat_trigger) }}
  seconds_since_setpoint_correction: >-
    {{ (now().timestamp() - (state_attr(last_setpoint_correction_helper, 'timestamp') | default(0, true))) }}
  sensor_stale: >-
    {{ (now().timestamp() - as_timestamp(states[ac_climate].last_updated)) > (sensor_staleness_minutes | float(10)) * 60 }}
  # Осушение — работа компрессора на холод, но без цели и без выхода по
  # температуре: единственный выход из dry это влажность. Как off-фаза
  # duty-цикла оно уводило комнату на 1.5-3 °C ниже цели, пробивало порог
  # входа в обогрев и разворачивало весь контур. Допуск вниз задаётся явно.
  dry_floor: "{{ target - dry_undershoot_allowance }}"
  dry_allowed_by_temp: "{{ predicted_t > dry_floor }}"
  humidity_wants_dry: >-
    {{ humidity_valid and (h >= hmax + hh or (current_mode == 'dry' and h > hmax - hh)) }}
  offphase_mode: >-
    {% if is_cool and humidity_wants_dry and dry_allowed_by_temp %}dry{% else %}off{% endif %}
  # Осушку, ушедшую ниже допуска, гасим немедленно, не дожидаясь мин. интервала:
  # иначе допуск в полградуса превращается в полтора градуса, пока барьер
  # досчитывает. Условие намеренно НЕ требует, чтобы влажность всё ещё хотела
  # осушки: нормальное завершение цикла — это как раз совпадение обеих причин
  # остановки, и при такой связке блок продолжал бы морозить уже ниже допуска.
  # Гашение по одной лишь влажности барьер по-прежнему ждёт — там датчик шумит
  # на пороге и без барьера блок задребезжит.
  dry_blocked_by_temp: >-
    {{ current_mode == 'dry' and is_cool and not dry_allowed_by_temp }}
  forbidden_modes: >-
    {{ ['cool', 'dry', 'auto'] if is_heat else (['heat', 'auto'] if is_cool else ['cool', 'dry', 'heat', 'auto']) }}
  opposite_modes: >-
    {{ ['cool', 'dry'] if is_heat else (['heat'] if is_cool else []) }}
  conflict_free: >-
    {{ other_ac_units | map('states') | select('in', opposite_modes) | list | count == 0 }}

triggers:
  - trigger: state
    entity_id: !input temp_sensor
    id: temp_updated
  - trigger: state
    entity_id: !input humidity_sensor
    id: humidity_updated
  - trigger: state
    entity_id: !input temp_rate_sensor
    id: rate_updated
  - trigger: state
    entity_id: !input system_direction_helper
    id: direction_changed
  - trigger: state
    entity_id: !input other_ac_units
    id: other_unit_changed
  - trigger: state
    entity_id: !input target_temp_helper
    id: target_temp_changed
  - trigger: state
    entity_id: !input heat_target_temp_helper
    id: heat_trigger_temp_changed
  - trigger: state
    entity_id: !input temp_hysteresis_helper
    id: band_changed
  - trigger: state
    entity_id: !input setpoint_hysteresis_helper
    id: setpoint_hyst_changed
  - trigger: state
    entity_id: !input humidity_threshold_helper
    id: humidity_max_changed
  - trigger: state
    entity_id: !input humidity_hysteresis_helper
    id: humidity_hyst_changed
  - trigger: state
    entity_id: !input min_interval_helper
    id: min_interval_changed
  - trigger: state
    entity_id: !input lag_helper
    id: lag_changed
  - trigger: state
    entity_id: !input enable_toggle
    to: "on"
    id: auto_control_enabled
  - trigger: state
    entity_id: !input ac_climate
    attribute: current_temperature
    id: ac_sensor_updated
  - alias: "Вход в любой компрессорный режим — чтобы ручное вмешательство, противоречащее направлению контура, ловилось за секунду, а не к следующему тику"
    trigger: state
    entity_id: !input ac_climate
    to: ["cool", "dry", "heat", "auto"]
    id: compressor_mode_entered
  - trigger: time_pattern
    minutes: "/1"
    id: tick

conditions:
  - condition: state
    entity_id: !input enable_toggle
    state: "on"
  - alias: "off — рабочая фаза паузы обогрева и простоя, поэтому НЕ прерываем автоматику на нём"
    condition: not
    conditions:
      - condition: state
        entity_id: !input ac_climate
        state: ["unavailable", "unknown"]
  - condition: numeric_state
    entity_id: !input temp_sensor
    above: !input min_valid_temp

mode: single
max_exceeded: silent

actions:
  - alias: "Выбор режима: duty-cycle с антиовершутом, в пределах разрешённого направления"
    choose:
      - alias: "Аварийный выход из режима, запрещённого текущим направлением мультисплита"
        conditions:
          - alias: "Режим противоречит направлению контура (или это auto, где блок может сам выбрать нагрев)"
            condition: template
            value_template: "{{ current_mode in forbidden_modes }}"
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "{{ offphase_mode }}"
          - alias: "Метку обновляем как при любой смене фазы: отсчёт всё равно обнуляется через last_changed climate-сущности, которую set_hvac_mode сбрасывает, поэтому не писать её — значит просто оставить хелпер протухшим. Вынужденность этой фазы учитывается отдельно, через forced_offphase"
            action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

      - alias: "Входим/возвращаемся в cool"
        conditions:
          - condition: template
            value_template: "{{ is_cool and current_mode != 'cool' }}"
          - alias: "Нативная защита от гонки: режим должен быть стабилен хотя бы 3 сек (проверяется движком HA по факту, а не нашим шаблоном)"
            condition: state
            entity_id: !input ac_climate
            state: ["dry", "off", "fan_only"]
            for:
              seconds: 3
          - alias: "Ни один соседний блок не работает в противоположную сторону"
            condition: template
            value_template: "{{ conflict_free }}"
          - condition: template
            value_template: "{{ duty > 0.02 }}"
          - alias: "Ожидание фазы duty-цикла не применяется к вынужденной паузе после разворота контура: её начал не duty-цикл, а смена направления"
            condition: template
            value_template: "{{ duty >= 0.98 or forced_offphase or seconds_since_mode_change >= (window_seconds - on_duration) }}"
          - condition: template
            alias: "Два независимых барьера: длина фазы duty-цикла считается по своей метке (чужое событие не должно запирать вход), а пауза компрессора — по факту последней смены состояния блока, кем бы она ни была вызвана"
            value_template: >-
              {{ seconds_since_mode_change >= min_cycle_seconds
                 and seconds_since_compressor_change >= min_off_seconds }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: cool
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

      - alias: "Выходим из cool по расчётной длительности фазы"
        conditions:
          - condition: template
            value_template: "{{ is_cool and current_mode == 'cool' }}"
          - alias: "Нативная защита от гонки: режим должен быть стабилен хотя бы 3 сек (проверяется движком HA по факту, а не нашим шаблоном)"
            condition: state
            entity_id: !input ac_climate
            state: "cool"
            for:
              seconds: 3
          - condition: template
            value_template: "{{ duty < 0.98 }}"
          - condition: template
            value_template: "{{ seconds_since_mode_change >= on_duration }}"
          - alias: "Барьер асимметричный, но не бесплатный: цель достигнута (duty упал в ноль) — гасим сразу, иначе блок доводит комнату за цель ровно на длину барьера. Если же цель ещё не достигнута, а duty просто просел (скакнула производная), держим минимальное время работы: on_duration пересчитывается каждый прогон, и без этого пола компрессор ловил бы пуски по 20-60 секунд. Третья ветка — потолок: пол считается по часам компрессора, а их взводит и чужое событие, поэтому при среднем duty дребезг облака откладывал бы выход раз за разом и давал тот самый перелёт мимо цели. Фаза не живёт дольше своего окна ни при каких условиях"
            condition: template
            value_template: >-
              {{ at_target
                 or seconds_since_compressor_change >= min_cycle_seconds
                 or seconds_since_mode_change >= window_seconds }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "{{ offphase_mode }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

      - alias: "Входим/возвращаемся в heat"
        conditions:
          - condition: template
            value_template: "{{ is_heat and current_mode != 'heat' }}"
          - alias: "Направление контура разрешает обогрев, но не обязывает: греем только комнату с собственной потребностью. Вход — ниже порога, дальше планка поднимается до целевой, иначе нагрев замирал бы на пороге, как в v3"
            condition: template
            value_template: "{{ heat_needed }}"
          - alias: "Нативная защита от гонки: режим должен быть стабилен хотя бы 3 сек (проверяется движком HA по факту, а не нашим шаблоном)"
            condition: state
            entity_id: !input ac_climate
            state: ["off", "fan_only"]
            for:
              seconds: 3
          - alias: "Ни один соседний блок не работает в противоположную сторону"
            condition: template
            value_template: "{{ conflict_free }}"
          - condition: template
            value_template: "{{ duty > 0.02 }}"
          - alias: "Ожидание фазы duty-цикла не применяется к вынужденной паузе после разворота контура: её начал не duty-цикл, а смена направления"
            condition: template
            value_template: "{{ duty >= 0.98 or forced_offphase or seconds_since_mode_change >= (window_seconds - on_duration) }}"
          - condition: template
            alias: "Два независимых барьера: длина фазы duty-цикла считается по своей метке (чужое событие не должно запирать вход), а пауза компрессора — по факту последней смены состояния блока, кем бы она ни была вызвана"
            value_template: >-
              {{ seconds_since_mode_change >= min_cycle_seconds
                 and seconds_since_compressor_change >= min_off_seconds }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: heat
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

      - alias: "Выходим из heat по расчётной длительности фазы"
        conditions:
          - condition: template
            value_template: "{{ is_heat and current_mode == 'heat' }}"
          - alias: "Нативная защита от гонки: режим должен быть стабилен хотя бы 3 сек (проверяется движком HA по факту, а не нашим шаблоном)"
            condition: state
            entity_id: !input ac_climate
            state: "heat"
            for:
              seconds: 3
          - condition: template
            value_template: "{{ duty < 0.98 }}"
          - condition: template
            value_template: "{{ seconds_since_mode_change >= on_duration }}"
          - alias: "Барьер асимметричный, но не бесплатный: цель достигнута (duty упал в ноль) — гасим сразу, иначе блок доводит комнату за цель ровно на длину барьера. Если же цель ещё не достигнута, а duty просто просел (скакнула производная), держим минимальное время работы: on_duration пересчитывается каждый прогон, и без этого пола компрессор ловил бы пуски по 20-60 секунд. Третья ветка — потолок: пол считается по часам компрессора, а их взводит и чужое событие, поэтому при среднем duty дребезг облака откладывал бы выход раз за разом и давал тот самый перелёт мимо цели. Фаза не живёт дольше своего окна ни при каких условиях"
            condition: template
            value_template: >-
              {{ at_target
                 or seconds_since_compressor_change >= min_cycle_seconds
                 or seconds_since_mode_change >= window_seconds }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "{{ offphase_mode }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

      - alias: "В off-фазе охлаждения — включаем/выключаем осушение по влажности (в т.ч. из off: иначе блок, оказавшийся выключенным без потребности в холоде, уже никогда не начнёт осушать)"
        conditions:
          - condition: template
            value_template: "{{ is_cool and current_mode in ['dry', 'off', 'fan_only'] }}"
          - alias: "Нативная защита от гонки: режим должен быть стабилен хотя бы 3 сек (проверяется движком HA по факту, а не нашим шаблоном)"
            condition: state
            entity_id: !input ac_climate
            state: ["dry", "off", "fan_only"]
            for:
              seconds: 3
          - alias: "Ручной fan_only не гасим: компрессор он не занимает, конфликта направлений не создаёт, поэтому лезть незачем — уводим из него только когда реально нужен dry"
            condition: template
            value_template: "{{ not (current_mode == 'fan_only' and offphase_mode == 'off') }}"
          - condition: template
            value_template: "{{ offphase_mode != current_mode }}"
          - alias: "Барьер держит вход в осушку и выход из неё по влажности, но не выход по температуре: ниже допуска гасим сразу, иначе барьер дорисовывает ещё градус увода вниз"
            condition: template
            value_template: >-
              {{ dry_blocked_by_temp or seconds_since_compressor_change >= min_cycle_seconds }}
        sequence:
          - action: climate.set_hvac_mode
            target:
              entity_id: !input ac_climate
            data:
              hvac_mode: "{{ offphase_mode }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_mode_change_helper
            data:
              datetime: "{{ now() }}"

  - alias: "Коррекция уставки под реальную температуру (троттлинг + защита от устаревшего встроенного датчика)"
    choose:
      - conditions:
          - alias: "Режим перечитываем движком, а не берём из current_mode: тот снят на старте прогона, а первый блок действий мог за эти миллисекунды погасить блок — и уставка улетала бы в выключенный кондиционер, впустую сжигая интервал троттлинга"
            condition: state
            entity_id: !input ac_climate
            state: ["cool", "dry", "heat"]
          - condition: template
            value_template: "{{ not sensor_stale }}"
          - condition: template
            value_template: "{{ seconds_since_setpoint_correction >= setpoint_correction_interval_minutes * 60 }}"
          - condition: numeric_state
            entity_id: !input ac_climate
            attribute: current_temperature
            above: !input min_valid_temp
          - condition: numeric_state
            entity_id: !input ac_climate
            attribute: temperature
            above: 0
        sequence:
          - variables:
              raw_offset: "{{ state_attr(ac_climate, 'current_temperature') | float(0) - t }}"
              offset: >-
                {{ [[raw_offset, -max_setpoint_offset] | max, max_setpoint_offset] | min }}
              raw_setpoint: "{{ target + offset }}"
              desired_setpoint: "{{ [[raw_setpoint, 16] | max, 30] | min | round(0) }}"
              current_setpoint: "{{ state_attr(ac_climate, 'temperature') | float(0) }}"
          - condition: template
            alias: "Отправляем только при изменении не меньше гистерезиса коррекции уставки"
            value_template: "{{ (desired_setpoint - current_setpoint) | abs >= setpoint_th }}"
          - delay:
              seconds: "{{ mode_switch_delay }}"
          - alias: "После паузы режим мог смениться (в т.ч. отскоком облака) — перечитываем ещё раз, уставка в выключенный блок теряется"
            condition: state
            entity_id: !input ac_climate
            state: ["cool", "dry", "heat"]
          - action: climate.set_temperature
            target:
              entity_id: !input ac_climate
            data:
              temperature: "{{ desired_setpoint }}"
          - action: input_datetime.set_datetime
            target:
              entity_id: !input last_setpoint_correction_helper
            data:
              datetime: "{{ now() }}"
